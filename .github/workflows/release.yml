name: Tagged Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit
        run: composer phpunit

      - name: Run PHPCS
        run: composer phpcs

      - name: Run PHPStan
        run: composer phpstan

      - name: Check PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -not -path './docs/*' -print0 | xargs -0 -n1 php -l

      - name: Build plugin for Plugin Check
        run: |
          bash bin/build-release.sh dist "${GITHUB_REF_NAME}"
          mkdir -p plugin-check
          unzip -q "dist/ai-connector-for-deepseek-guducat-ver-${GITHUB_REF_NAME}.zip" -d plugin-check

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './plugin-check/ai-connector-for-deepseek-guducat-ver'
          slug: ai-connector-for-deepseek-guducat-ver

      - name: Build release archive
        run: bash bin/build-release.sh dist "${GITHUB_REF_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ai-connector-for-deepseek-guducat-ver-${{ github.ref_name }}.zip
            dist/ai-connector-for-deepseek-guducat-ver-${{ github.ref_name }}.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
