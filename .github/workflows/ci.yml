name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '7.4'
          - '8.4'

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit
        run: composer phpunit

      - name: Run PHPCS
        run: composer phpcs

      - name: Run PHPStan
        run: composer phpstan

      - name: Check PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -not -path './docs/*' -print0 | xargs -0 -n1 php -l

      - name: Build plugin for Plugin Check
        run: |
          version=$(sed -n 's/^ \* Version:[[:space:]]*//p' ai-connector-for-deepseek-guducat-ver.php | head -n 1)
          bash bin/build-release.sh dist "v${version}"
          mkdir -p plugin-check
          unzip -q "dist/ai-connector-for-deepseek-guducat-ver-v${version}.zip" -d plugin-check

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './plugin-check/ai-connector-for-deepseek-guducat-ver'
          slug: ai-connector-for-deepseek-guducat-ver
